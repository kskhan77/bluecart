        pop.classList.add("open"); btn.classList.add("open"); popFor = btn;
        var r = btn.getBoundingClientRect(), w = Math.min(340, window.innerWidth - 24);
        var left = Math.max(12, Math.min(r.left - 10, window.innerWidth - w - 12));
        var top = r.bottom + 8;
        pop.style.left = left + "px"; pop.style.top = top + "px";
        var h = pop.offsetHeight;
        if (top + h > window.innerHeight - 8) { pop.style.top = Math.max(8, r.top - h - 8) + "px"; }   /* no room below: open above */
      }
      document.addEventListener("click", function (e) {
        if (pop.classList.contains("open") && !pop.contains(e.target) && !(e.target.closest && e.target.closest(".bcc-info-btn"))) { closePop(); }
      });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closePop(); } });
      function infoButtons() {
        Array.prototype.forEach.call(document.querySelectorAll("#annotation-forms .shadcn-radio-option:not(.bcc-has-info)"), function (opt) {
          var input = opt.querySelector("input"); var info = input && INFO[input.id];
          opt.classList.add("bcc-has-info");
          if (!info) { return; }
          var b = document.createElement("button");
          b.type = "button"; b.className = "bcc-info-btn"; b.textContent = "?";
          b.title = "What does this mean?"; b.setAttribute("aria-label", "What does " + info.t + " mean?");
          b.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); openPop(b, info); });
          b.addEventListener("mousedown", function (e) { e.preventDefault(); });   /* keep the card from reacting */
          opt.appendChild(b);
        });
      }
      /* Clearing an answer. A radio button cannot be unticked in a browser, so: the optional reason can be cleared
         by clicking the chosen chip again or with the Clear button in its title; and Step 2 is cleared by itself
         when Step 1 changes to "Never the blue cart" or "Can't tell", so no stale state answer stays in the data.
         Potato stores a cleared option as a "not selected" marker (value false), which our scripts ignore. */
      function clearSchema(schemaId) {
        var checked = document.querySelector("#" + schemaId + " input:checked");
        if (!checked) { return; }
        var schema = checked.getAttribute("schema"), labelName = checked.getAttribute("label_name");
        checked.checked = false;
        try { if (typeof currentAnnotations !== "undefined" && currentAnnotations && currentAnnotations[schema]) { delete currentAnnotations[schema]; } } catch (err) {}
        var id = null;
        try { id = (typeof currentInstance !== "undefined" && currentInstance) ? currentInstance.id : null; } catch (err) {}
        if (!id) { return; }
        var body = { instance_id: id, annotations: {}, client_timestamp: new Date().toISOString() };
        body.annotations[schema + ":::" + labelName] = false;
        fetch("/updateinstance", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
          .catch(function () {});
      }
      var reasonWasChecked = false;
      document.addEventListener("mousedown", function (e) {
        var lbl = e.target.closest && e.target.closest("#reason .shadcn-radio-label");
        var input = lbl && lbl.previousElementSibling;
        reasonWasChecked = !!(input && input.type === "radio" && input.checked);
      }, true);
      document.addEventListener("click", function (e) {
        var lbl = e.target.closest && e.target.closest("#reason .shadcn-radio-label");
        if (!lbl || !reasonWasChecked) { return; }
        e.preventDefault(); e.stopPropagation();             /* second click on the chosen chip: clear it */
        reasonWasChecked = false;
        clearSchema("reason");
      }, true);
      document.addEventListener("change", function (e) {
        var input = e.target;
        if (input && input.type === "radio" && input.closest && input.closest("#cart") && input.checked && input.value !== "blue_cart") {
          setTimeout(function () { clearSchema("condition"); }, 50);   /* after Potato has saved Step 1 */
        }
      }, true);
      function clearButton() {
        var legend = document.querySelector("form#reason legend");
        if (!legend) { return; }
