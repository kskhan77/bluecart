        if (!btn) {
          btn = document.createElement("button");
          btn.type = "button"; btn.className = "bcc-clear"; btn.innerHTML = "Clear &times;"; btn.title = "Remove the chosen reason";
          btn.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); clearSchema("reason"); });
          legend.appendChild(btn);
        }
        btn.style.display = document.querySelector("#reason input:checked") ? "inline-block" : "none";
