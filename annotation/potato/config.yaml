  <script>
    /* Fills the status line above Step 1. It only READS which cards are chosen; it saves nothing. */
    (function () {
      var STATE = {
        ready:       ["Accepted", "It can go in the blue cart as it is.", "#1f7a3d"],
        needs_prep:  ["Accepted after prep", "Blue cart, but only after a quick fix.", "#b26a00"],
        ruined:      ["Not accepted", "It is ruined, so it goes in the trash.", "#b3261e"],
        cannot_tell: ["Cannot determine", "The photo does not show its state.", "#6b7280"]
      };
      function update() {
        var box = document.querySelector(".bcc-status");
        if (!box) { return; }
        var cart = document.querySelector("#cart input:checked");
        var cond = document.querySelector("#condition input:checked");
        var text, color = "#8a93a6";
        if (!cart) {
          text = "<b>Start with Step 1.</b>&nbsp;Click a card or press 1, 2 or 3.";
        } else if (cart.value === "not_blue_cart") {
          text = "<b>Your answer: Not accepted.</b>&nbsp;Never the blue cart. Press &rarr; for the next photo."; color = "#1b1f27";
        } else if (cart.value === "cannot_tell") {
          text = "<b>Your answer: Cannot determine.</b>&nbsp;You can't tell what the item is. Press &rarr; for the next photo."; color = "#6b7280";
        } else if (!cond || !STATE[cond.value]) {
          text = "<b>Blue cart item. Now Step 2:</b>&nbsp;what state is it in? Click a card or press 4, 5, 6 or 7."; color = "#1565c0";
        } else {
          var s = STATE[cond.value];
          text = "<b>Your answer: " + s[0] + ".</b>&nbsp;" + s[1] + " Press &rarr; for the next photo."; color = s[2];
        }
        if (box.getAttribute("data-shown") !== text) {
          box.innerHTML = "<span>" + text + "</span>"; box.style.borderColor = color; box.setAttribute("data-shown", text);
        }
      }
      setInterval(update, 200);
      document.addEventListener("DOMContentLoaded", update);
    })();
  </script>
  <script>
    /* Keys and cards: light up the key that was pressed, pop the chosen card, wave the keys when a photo
       or Step 2 appears, let the legend buttons act like keys, and ignore the Step 2 keys while Step 2 is
       hidden. Also opens and closes the help panel. Display only: Potato still does all the saving. */
    (function () {
      var motionOk = !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      function keyOf(e) {
        var k = (e.key || "").toLowerCase();
        return (k === "arrowright" || k === "arrowleft" || /^[1-7]$/.test(k)) ? k : "";
      }
      function typing(e) {                      /* the person is writing in a text box, not using shortcuts */
        var t = e.target;
        return !!(t && t.tagName && (t.tagName === "TEXTAREA" || (t.tagName === "INPUT" && t.type !== "radio" && t.type !== "checkbox")));
      }
      function visible(el) { return !!(el && el.offsetParent !== null && getComputedStyle(el).visibility !== "hidden"); }
      function step2Shown() {                   /* Potato hides a conditional question with the class display-logic-hidden */
        var c = document.querySelector("#condition");
        var wrap = c && c.closest && c.closest(".display-logic-container");
        return !!c && !(wrap && wrap.classList.contains("display-logic-hidden")) && visible(c);
      }
      function legendButtons(key) { return Array.prototype.slice.call(document.querySelectorAll('.bcc-keys [data-key="' + key + '"]')); }
      function caps(key) {                      /* every keycap that shows this key: legend, help panel, card badge */
        var sel = '.bcc-keys [data-key="' + key + '"] kbd, .bcc-help-panel kbd[data-key="' + key + '"]';
        var out = Array.prototype.slice.call(document.querySelectorAll(sel));
        var radio = document.querySelector('#annotation-forms input[data-key="' + key + '"]');
        var badge = radio && radio.parentNode.querySelector(".keybinding-badge");
        if (badge) { out.push(badge); }
        return out;
      }
      function flash(els, cls, ms) {
        els.forEach(function (el) {
          el.classList.remove(cls); void el.offsetWidth;      /* restart the animation if it is still running */
          el.classList.add(cls);
          setTimeout(function () { el.classList.remove(cls); }, ms);
        });
      }
      function wave(keys) {
        if (!motionOk) { return; }
        keys.forEach(function (k, i) { setTimeout(function () { flash(caps(k), "bcc-wave", 600); }, 90 * i); });
      }

      /* a key goes down: light it up at once. 4 to 7 shake, and are ignored, while Step 2 is hidden */
      var lastKeyAt = 0;
      document.addEventListener("keydown", function (e) {
        var k = keyOf(e);
        if (!k || typing(e)) { return; }
        lastKeyAt = Date.now();
        if (/^[4-7]$/.test(k) && !step2Shown()) {
          flash(caps(k).concat(legendButtons(k)), "bcc-nope", 420);
          var status = document.querySelector(".bcc-status");
          if (status) { flash([status], "bcc-nope-box", 420); }
        } else {
          flash(caps(k), "bcc-pressed", 450);
        }
      }, true);
      document.addEventListener("keyup", function (e) {         /* Potato selects on keyup: stop it for hidden Step 2 */
        var k = keyOf(e);
        if (/^[4-7]$/.test(k) && !step2Shown() && !typing(e)) { e.stopImmediatePropagation(); }
      }, true);

      /* a card was chosen (key or mouse): it pops, and a mouse click also lights its key */
      document.addEventListener("change", function (e) {
        var input = e.target;
        if (!input || input.type !== "radio" || !input.closest || !input.closest("#annotation-forms")) { return; }
        var label = input.parentNode.querySelector(".shadcn-radio-label");
        if (label) { flash([label], "bcc-pop", 380); }
        var k = input.getAttribute("data-key");
        if (k && Date.now() - lastKeyAt > 400) { flash(caps(k), "bcc-pressed", 450); }
      }, true);

      /* the legend buttons act like the keys (useful on a tablet) */
      document.addEventListener("click", function (e) {
        var btn = e.target.closest && e.target.closest(".bcc-key");
        if (!btn) { return; }
        var k = btn.getAttribute("data-key");
        if (k === "arrowright" || k === "arrowleft") {
          document.body.dispatchEvent(new KeyboardEvent("keydown", { key: k === "arrowright" ? "ArrowRight" : "ArrowLeft", bubbles: true }));
          return;
        }
        var radio = document.querySelector('#annotation-forms input[data-key="' + k + '"]');
        if (radio && visible(radio.parentNode)) { radio.click(); } else { flash(caps(k).concat([btn]), "bcc-nope", 420); }
      });

      /* help panel: open and close, Escape closes; the button pulses once per browser session */
      var helpBtn = document.querySelector(".bcc-help-btn"), panel = document.querySelector(".bcc-help-panel");
      function setOpen(open) { panel.classList.toggle("open", open); helpBtn.setAttribute("aria-expanded", open ? "true" : "false"); }
      if (helpBtn && panel) {
        helpBtn.addEventListener("click", function () { setOpen(!panel.classList.contains("open")); });
        panel.querySelector(".bcc-close").addEventListener("click", function () { setOpen(false); });
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") { setOpen(false); } });
        try {
          if (!sessionStorage.getItem("bcc-hello")) { helpBtn.classList.add("bcc-hello"); sessionStorage.setItem("bcc-hello", "1"); }
        } catch (err) { helpBtn.classList.add("bcc-hello"); }
      }

      /* a new photo: the Step 1 keys wave. Step 2 appears: its keys wave. Step 2 keys are grey while hidden */
      var lastPhoto = null, step2Was = false;
      function tick() {
        var img = document.querySelector("img.display-image");
        var src = img ? img.getAttribute("src") : null;
        if (src && src !== lastPhoto) {
          lastPhoto = src; step2Was = step2Shown();
          if (!document.querySelector("#cart input:checked")) { wave(["1", "2", "3"]); }
        }
        var s2 = step2Shown();
        ["4", "5", "6", "7"].forEach(function (k) { legendButtons(k).forEach(function (b) { b.classList.toggle("bcc-off", !s2); }); });
        if (s2 && !step2Was && !document.querySelector("#condition input:checked")) { wave(["4", "5", "6", "7"]); }
        step2Was = s2;
      }
      setInterval(tick, 150);
    })();
  </script>

output_annotation_dir: annotation_output/
export_annotation_format: jsonl
# Refresh annotation_output/exports/jsonl/annotations.jsonl on EVERY save.
# Potato's default is at most once a minute, which leaves the last labels of a
# session out of the export file (found in our end-to-end test, 2026-10-04).
auto_export_interval: 0
alert_time_each_instance: 10000000

