      function progressCard() {
        var host = document.querySelector("#main-content > .mb-4");
        if (!host) { return; }
        var card = document.querySelector(".bcc-progress");
        /* phones: the card is a thin strip right under the top bar; desktops: the first thing above the photo */
        if (card) {
          var navEl = document.querySelector(".potato-navbar");
          if (phoneQ.matches) { if (navEl && card.previousElementSibling !== navEl) { navEl.insertAdjacentElement("afterend", card); } }
          else if (card.parentNode !== host) { host.insertBefore(card, host.firstChild); }
        }
        if (!card) {
          card = document.createElement("div"); card.className = "bcc-progress";
          card.innerHTML = '<div class="bcc-pg-top"><span class="bcc-pg-title"><i class="fas fa-chart-simple"></i> Your progress</span><span class="bcc-pg-status"></span></div>' +
            '<div class="bcc-pg-bar"><div class="bcc-pg-fill"></div></div>' +
            '<div class="bcc-pg-meta"><span class="bcc-pg-count"></span><span class="bcc-pg-item"></span></div>' +
            '<div class="bcc-pg-nav"><button type="button" data-act="prev" title="Jump to the previous photo you have not labeled"><i class="fas fa-backward"></i> Previous unlabeled</button>' +
            '<button type="button" data-act="next" title="Jump to the next photo you have not labeled"><i class="fas fa-forward"></i> Next unlabeled</button>' +
            '<label>Go to # <input type="number" min="1" aria-label="Photo number"><button type="button" class="bcc-go" data-act="go">Go</button></label></div>';
          host.insertBefore(card, host.firstChild);
          card.addEventListener("click", function (e) {
            var b = e.target.closest && e.target.closest("button"); if (!b) { return; }
            var act = b.getAttribute("data-act"), t;
            if (act === "prev") { t = document.getElementById("jump-unannotated-prev-btn"); if (t) { t.click(); } }
            if (act === "next") { t = document.getElementById("jump-unannotated-btn"); if (t) { t.click(); } }
            if (act === "go") {
              var n = card.querySelector("input").value, g = document.getElementById("go_to"), gb = document.getElementById("go-to-btn");
              if (n && g) { g.value = n; if (gb) { gb.click(); } }
            }
          });
          card.querySelector("input").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); card.querySelector('[data-act="go"]').click(); } });
        }
        /* Potato's own counter and badge refresh only when the next photo loads, so the card also looks at the
           answers on screen: this photo counts as labeled as soon as Step 1 (and Step 2, when shown) is answered */
        var pc = document.getElementById("progress-counter"), inum = document.getElementById("instance-number"), st = document.getElementById("annotation-status");
        var serverLabeled = !!(st && /^labeled/i.test(st.textContent.trim()));
        var localLabeled = !!document.querySelector("#cart input:checked") && (!step2Shown() || !!document.querySelector("#condition input:checked"));
        var m = pc && /(\d+)\s*\/\s*(\d+)/.exec(pc.textContent || "");
        if (m) {
          var done = +m[1] + (localLabeled && !serverLabeled ? 1 : 0), total = +m[2];
