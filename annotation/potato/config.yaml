          var c = card.querySelector(".bcc-pg-count"); if (c.innerHTML !== txt) { c.innerHTML = txt; }
        }
        if (inum) { var it = "photo <b>" + inum.textContent.trim() + "</b>"; var ie = card.querySelector(".bcc-pg-item"); if (ie.innerHTML !== it) { ie.innerHTML = it; } }
        var s = card.querySelector(".bcc-pg-status"), text = (localLabeled || serverLabeled) ? "Labeled" : "Not labeled";
        if (s.textContent !== text) { s.textContent = text; }
