annotation_task_name: "Blue Cart Check: Which bin does this go in?"
task_dir: "."
data_files:
  - data/items.jsonl
item_properties:
  id_key: id
  text_key: image
media_directory: media

# "Guidelines" button in Potato's top bar: opens the full guidelines in a new tab.
# media/guidelines.html is generated from annotation/guidelines.md by make_annotation_packs.py.
annotation_codebook_url: /media/guidelines.html
ui_language:
  codebook: "Guidelines"

# Welcome page (welcome.html): shown once to every annotator before the first photo.
phases:
  order: [instructions, annotation]
  instructions:
    type: instructions
    file: welcome.html
  annotation:
    type: annotation

instance_display:
  fields:
    - key: image
      type: image
      label: "Item photo"
      display_options:
        zoomable: true
        object_fit: contain
        max_height: "46vh"     # whole photo visible, no scrolling inside the photo box
        resizable: false

annotation_schemes:
  # Rules cheat sheet shown next to every photo (display only, nothing to click).
  # KEEP IN SYNC with annotation/guidelines.md (Sections 3 and 4).
  - annotation_type: pure_display
    name: rules
    allow_html: true
    description: "Flint blue-cart rules at a glance"
    labels:
      - |
        <p><b>How it works:</b> 1. Look at the photo. 2. Step 1: the kind of item. 3. Step 2: its state (blue cart items only). 4. Next.</p>
        <p><b>Blue cart items:</b> paper and cartons, cardboard, cans and foil trays, empty aerosol cans, plastic bottles, jugs, jars and tubs, glass bottles and jars.</p>
        <p><b>Never the blue cart:</b> plastic bags, wrap and zip bags; cups, paper or plastic; Styrofoam; plastic cutlery; food; batteries and electronics; cords and hoses; ceramic and Pyrex; hangers; anything else not on the blue list.</p>
        <p>Judge the <b>main item</b>, exactly as it looks in the photo. Full rules and examples: the <b>Guidelines</b> button at the top.</p>

  # STEP 1: what kind of item is it?  (keys 1-3)
  - annotation_type: radio
    name: cart
    description: "Step 1. What kind of item is this?"
    labels:
      - name: blue_cart
        displayed_label: "Blue cart item"
        tooltip: "Paper, cartons, cardboard, cans, foil trays, empty aerosol cans, plastic bottles/jugs/jars/tubs, rigid plastic clamshells (not foam), glass bottles and jars. Judge only the KIND of item here; its state is Step 2."
        key_value: "1"
      - name: not_blue_cart
        displayed_label: "Never the blue cart"
        tooltip: "Bags, wrap, cups, Styrofoam, cutlery, food, batteries, electronics, cords, ceramic, hangers, and anything else that is not a blue cart item. Trash (black or gray bin) or special drop-off."
        key_value: "2"
      - name: cannot_tell
        displayed_label: "Can't tell"
        tooltip: "The item or its material can't be identified, it is cut off or blurry, or there is no single main item."
        key_value: "3"
    label_requirement:
      required: true
    sequential_key_binding: false

  # STEP 2: only for blue cart items: what state is it in?  (keys 4-7)
  - annotation_type: radio
    name: condition
    description: "Step 2. It is a blue cart item. What state is it in, AS SHOWN?"
    display_logic:
      show_when:
        - schema: cart
          operator: equals
          value: blue_cart
    labels:
      - name: ready
        displayed_label: "Ready"
        tooltip: "Empty, clean, loose, flat. It can go in the blue cart exactly as it is."
        key_value: "4"
      - name: needs_prep
        displayed_label: "Needs prep first"
        tooltip: "Food or liquid left in a container, a big box that is not flattened, or accepted items inside a plastic bag."
        key_value: "5"
      - name: ruined
        displayed_label: "Ruined"
        tooltip: "Paper or cardboard with grease or food soaked into it, like a greasy pizza box. It cannot be rinsed, so it goes in the trash."
        key_value: "6"
      - name: cannot_tell
        displayed_label: "Can't see enough"
        tooltip: "For example, you can't see inside the container to check whether it is empty."
        key_value: "7"
    label_requirement:
      required: true
    sequential_key_binding: false

  - annotation_type: radio
    name: reason
    description: "(Optional) Main reason for your choice"
    # The stored values (name) stay as in the guidelines; displayed_label is the text shown, tooltip the hover text.
    labels:
      - name: material
        displayed_label: "Material"
        tooltip: "What it is made of decided your answer: paper, cardboard, metal, glass and rigid plastic are blue cart kinds; plastic film, Styrofoam, ceramic and textiles never are."
      - name: contamination
        displayed_label: "Dirty or greasy"
        tooltip: "Food, grease or liquid on or in the item decided your answer: a jar with sauce needs a rinse, a greasy pizza box is ruined."
      - name: bagged
        displayed_label: "In a plastic bag"
        tooltip: "The items sit inside a plastic bag, so they must come out first. The bag itself never goes in the blue cart."
      - name: form_factor
        displayed_label: "Shape or size"
        tooltip: "The shape decided it, not the material: cups, lids, straws, cutlery, film and wrap are not accepted even when the plastic is; a big unflattened box needs prep."
      - name: hazard_or_electronics
        displayed_label: "Hazard or electronics"
        tooltip: "Batteries, cords, cables, hoses, electronics or chemicals: never the blue cart. They endanger workers and jam the machines."
      - name: unclear
        displayed_label: "Unclear photo"
        tooltip: "The photo itself blocked the decision: blurry, cut off, too small or dark, or no single main item."

output_annotation_dir: annotation_output/
export_annotation_format: jsonl
# Refresh annotation_output/exports/jsonl/annotations.jsonl on EVERY save.
# Potato's default is at most once a minute, which leaves the last labels of a
# session out of the export file (found in our end-to-end test, 2026-10-04).
auto_export_interval: 0
alert_time_each_instance: 10000000

require_password: false

user_config:
  allow_all_users: true
  users: []
