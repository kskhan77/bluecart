        document.addEventListener("keydown", function (e) { if (e.key === "Escape") { setOpen(false); } });
        try { if (sessionStorage.getItem("bcc-help-seen") === "1") { helpBtn.classList.add("bcc-quiet"); } } catch (err) {}
        /* the tutorial video ships with the hosted tool only; hide its link where the file is missing (zip packs) */
        var videoLink = panel.querySelector(".bcc-video-link");
