      }

      /* the small ? on every answer: what it means, examples, when to pick it. Text follows annotation/guidelines.md. */
      var INFO = {
        cart_blue_cart_radio: { t: "Blue cart item", k: "1", m: "The KIND of item is one Flint recycles: paper, cartons and cardboard; cans, foil trays and empty aerosol cans; plastic bottles, jugs, jars, tubs and rigid clamshells; glass bottles and jars.",
          ex: ["cereal box", "soda can", "milk jug", "pickle jar", "greasy pizza box (still cardboard)"], w: "Pick it for the material even when the item is dirty or bagged. Its state is Step 2." },
        cart_not_blue_cart_radio: { t: "Never the blue cart", k: "2", m: "The item is a kind Flint never takes, whatever its state: bags, wrap, cups, Styrofoam, cutlery, food, batteries, electronics, cords, hoses, ceramic, hangers, clothes.",
          ex: ["coffee cup", "plastic grocery bag", "phone charger", "AA battery", "styrofoam tray"], w: "Pick it when the item itself is the problem. Trash, or a special drop-off." },
        cart_cannot_tell_radio: { t: "Can't tell", k: "3", m: "The photo itself blocks the decision: you can't identify the item or its material, it is cut off or blurry, or there is no single main item.",
          ex: ["shiny wrapper: foil or plastic film?", "blurry photo", "half an item at the edge", "a pile with no main item"], w: "If you are about 70% sure, pick an answer instead. Use this only when the photo is the problem." },
        condition_ready_radio: { t: "Ready", k: "4", m: "Empty, reasonably clean, loose and, if it is a big box, flattened. Light printing, a label or a small dry crumb still count as clean. A cap on an empty bottle is fine.",
          ex: ["empty can", "rinsed jar", "flat cereal box", "empty water bottle with cap"], w: "Pick it when it can go in the blue cart exactly as it is." },
        condition_needs_prep_radio: { t: "Needs prep first", k: "5", m: "Accepted material, but one quick fix first: food or liquid left inside, a big box that is not flattened, or accepted items inside a plastic bag.",
          ex: ["jar with sauce left", "half-full bottle", "cans inside a bag", "unflattened moving box"], w: "Pick it when a rinse, emptying, flattening or unbagging would make it ready." },
        condition_ruined_radio: { t: "Ruined", k: "6", m: "Paper or cardboard with grease or food soaked INTO it. It cannot be rinsed, so it goes in the trash.",
          ex: ["greasy pizza box bottom", "oily paper plate", "soaked paper bag"], w: "Only for paper and cardboard. A dirty plastic, glass or metal container can be rinsed: that is Needs prep." },
        condition_cannot_tell_radio: { t: "Can't see enough", k: "7", m: "It is a blue cart kind, but the photo does not show its state: a closed container you can't see into, too small, too dark.",
          ex: ["closed tub, lid on", "box seen only from the outside", "tiny or dark photo"], w: "Pick it when the state is hidden, not when the item is simply dirty." },
        reason_material_radio: { t: "Material", m: "What it is made of decided your answer.", ex: ["cardboard: blue cart", "Styrofoam: never", "ceramic mug: never"], w: "The material alone settled Step 1." },
        reason_contamination_radio: { t: "Dirty or greasy", m: "Food, grease or liquid on or in the item decided your answer.", ex: ["jar with sauce: needs prep", "greasy pizza box: ruined", "half-full bottle: needs prep"], w: "The dirt settled Step 2." },
        reason_bagged_radio: { t: "In a plastic bag", m: "The items sit inside a plastic bag, so they must come out first. The bag itself never goes in the blue cart.", ex: ["cans in a tied grocery bag", "paper in a trash bag"], w: "Blue cart item, then Needs prep." },
        reason_form_factor_radio: { t: "Shape or size", m: "The shape decided it, not the material: cups, lids, straws, cutlery, film and wrap are not accepted even when the plastic is. A huge box that is not flattened needs prep.", ex: ["plastic cup", "straw", "stretch wrap", "giant unflattened box"], w: "Same material as an accepted item, but the shape makes the difference." },
        reason_hazard_or_electronics_radio: { t: "Hazard or electronics", m: "Batteries, cords, cables, hoses, electronics or chemicals. They endanger workers and wrap around the sorting machines.", ex: ["AA battery", "USB cable", "garden hose", "old phone"], w: "Never the blue cart; these have their own drop-offs." },
        reason_unclear_radio: { t: "Unclear photo", m: "The photo itself blocked the decision.", ex: ["blurry", "cut off", "too dark", "no single main item"], w: "Pairs with Can't tell or Can't see enough." }
      };
      var pop = document.createElement("div"); pop.className = "bcc-info-pop"; pop.setAttribute("role", "dialog");
      document.addEventListener("DOMContentLoaded", function () { document.body.appendChild(pop); });
      if (document.body) { document.body.appendChild(pop); }
      var popFor = null;
      function closePop() { pop.classList.remove("open"); if (popFor) { popFor.classList.remove("open"); } popFor = null; }
      function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
      function openPop(btn, info) {
        if (popFor === btn) { closePop(); return; }
        closePop();
        pop.innerHTML = "<button type=\"button\" class=\"bcc-close\" aria-label=\"Close\">&times;</button>" +
          "<h5>" + esc(info.t) + (info.k ? "<kbd>" + info.k + "</kbd>" : "") + "</h5>" +
          "<p>" + esc(info.m) + "</p>" +
          "<b class=\"bcc-lbl\">Examples</b><div class=\"bcc-ex\">" + info.ex.map(function (x) { return "<span>" + esc(x) + "</span>"; }).join("") + "</div>" +
          "<b class=\"bcc-lbl\">Pick it when</b><p>" + esc(info.w) + "</p>";
